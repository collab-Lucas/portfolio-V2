<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Lucas Bonneau</title>
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- CSS Critique pour le rendu initial -->
  <style>
    /* Variables CSS critiques */
    :root {
      --bg-transparent-light: rgba(255, 255, 255, 0.1);
      --bg-transparent-dark: rgba(0, 0, 0, 0.36);
      --border-light: rgba(255, 255, 255, 0.2);
      --transition-fast: all 0.2s ease;
      --transition-medium: all 0.3s ease;
      --transition-slow: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Styles critiques pour éviter le FOUC */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #1a1a1a;
      color: white;
      overflow-x: hidden;
    }
    
    app-root {
      display: block;
      min-height: 100vh;
    }
    
    /* Styles critiques pour le navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1030;
      transition: var(--transition-slow);
    }
    
    /* Styles critiques pour la section intro */
    .intro-section {
      position: absolute;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
    }
    
    .intro-section h1 {
      font-size: 3rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
      margin: 0;
    }
    
    /* Loader pour éviter les contenus vides */
    .loading-spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 3px solid var(--border-light);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 9999;
    }
    
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
  
  <!-- Preload des ressources critiques (modifié pour Vercel) -->
  <!-- <link rel="preload" href="assets/img/webp/logo-site.webp" as="image" type="image/webp"> -->
  <!-- <link rel="preload" href="assets/models/navbar_scene.glb" as="fetch" crossorigin="anonymous"> -->
  <link rel="preload" href="styles.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
  
  <!-- Polices avec font-display swap -->
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,600,700,800&display=swap" rel="stylesheet">
  
  <!-- Plausible Analytics -->
  <script async defer data-domain="lucas-bonneau-portfolio.vercel.app" src="https://plausible.io/js/plausible.js"></script>
</head>
<body class="bg-dark">
  <!-- Loader critique -->
  <div class="loading-spinner" id="critical-loader"></div>
  
  <app-root></app-root>
  
  <!-- Script pour masquer le loader quand l'app est prête -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loader = document.getElementById('critical-loader');
      const appRoot = document.querySelector('app-root');
      
      // Observer pour détecter quand le contenu est chargé
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes.length > 0) {
            setTimeout(() => {
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300);
              }
            }, 500);
            observer.disconnect();
          }
        });
      });
      
      if (appRoot) {
        observer.observe(appRoot, { childList: true, subtree: true });
      }
    });
  </script>
</body>
</html>
