<section id="contact" class="p-5 text-light contact-section">
  <div class="container">
    <div  class="card-contact">
    <h2 class="text-center mb-5 section-title">Contact</h2>
    <form class="mx-auto contact-form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Nom" 
               [(ngModel)]="form.name" name="name" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" 
               [(ngModel)]="form.email" name="email" required>
      </div>
      <div class="mb-3">
        <textarea class="form-control" placeholder="Message" rows="4" 
                  [(ngModel)]="form.message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="fa fa-paper-plane me-2"></i>Envoyer
      </button>
    </form>
    </div>
  </div>
</section>
